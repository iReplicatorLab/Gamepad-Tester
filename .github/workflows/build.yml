name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  VERSION: "0.2.0"

jobs:
  linux-deb:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Build .deb (${{ matrix.arch }})
        run: |
          chmod +x build/build-deb.sh build/linux/ireplicator-gamepad-tester.wrapper
          ./build/build-deb.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows (${{ matrix.arch }})
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process
          ./build/windows/build.ps1 -Arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: build/dist/ireplicator-gamepad-tester_${{ env.VERSION }}_win-${{ matrix.arch }}.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build macOS (${{ matrix.arch }})
        run: |
          chmod +x build/macos/build.sh
          ./build/macos/build.sh "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: build/dist/ireplicator-gamepad-tester_${{ env.VERSION }}_mac-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [linux-deb, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.zip
          generate_release_notes: true
          draft: false
