name: Republish Linux release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish v0.1.0 Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Linux build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow build.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name linux-amd64 --dir dist/amd64
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name linux-arm64 --dir dist/arm64

      - name: Prepare release files
        run: |
          mkdir -p release
          find dist -type f \( -name '*.deb' -o -name '*.AppImage' \) | while read -r file; do
            base="$(basename "$file")"
            clean="${base//iReplicator Gamepad Tester/iReplicator-Gamepad-Tester}"
            cp "$file" "release/$clean"
          done
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: v0.1.0 — Linux builds
          files: release/*
          generate_release_notes: false
          body: |
            ## Linux downloads

            - **amd64**: `.deb` installer and `.AppImage`
            - **arm64**: `.deb` installer and `.AppImage`

            Built from commit 527d57b — native Rust gamepad backend (no Python sidecar).

            ### Install

            **Debian/Ubuntu:**
            ```bash
            sudo dpkg -i iReplicator-Gamepad-Tester_0.1.0_amd64.deb
            sudo ./setup-input-access.sh   # then log out and back in
            ```

            **AppImage:** download, `chmod +x`, run directly.

            Windows builds are available as GitHub Actions artifacts from the same workflow run.
