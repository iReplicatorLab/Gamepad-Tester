name: Close stale Cursor PR

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  close-pr-1:
    name: Close draft PR #1
    if: github.event_name == 'workflow_dispatch' || github.event.before != github.event.after
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: 1,
            });
            if (pr.data.state === 'open') {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: 1,
                state: 'closed',
              });
              core.info('Closed PR #1');
            } else {
              core.info('PR #1 already closed');
            }
